<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARECADE SMP - Payment</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:linear-gradient(145deg,#020914,#061a30,#020811);color:#eef6ff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}.card{width:100%;max-width:520px;background:#061426;border:1px solid #1c527e;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0008}.brand{text-align:center}.brand h1{margin:0;font-size:30px;letter-spacing:2px}.brand p{color:#8fb7dc;margin:8px 0 22px}.qr{background:#fff;border-radius:18px;padding:14px;width:max-content;margin:auto}.qr img{display:block;width:240px;max-width:65vw}.hint{text-align:center;color:#9db7d1;line-height:1.5;margin:18px 0 24px}label{display:block;margin:14px 0 7px;font-weight:bold}input,select{width:100%;padding:13px;border-radius:12px;border:1px solid #244463;background:#081a2d;color:white;font-size:15px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:#147fd1;color:#fff;font-size:16px;font-weight:bold}button:active{transform:scale(.99)}.note{margin-top:16px;padding:12px;border-radius:12px;background:#0b2942;color:#9fc8ec;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<main class="card">
<div class="brand"><h1>ARECADE SMP</h1><p>Payment Center</p></div>
<div class="qr"><img src="https://sociabuzz.com/pro/tribe/qrcode/v2/7146504937" alt="SociaBuzz QR Code"></div>
<div class="hint">Scan QR di atas untuk melakukan pembayaran melalui SociaBuzz, lalu isi data pembelian.</div>
<form id="orderForm">
<label>Minecraft Username</label>
<input id="username" placeholder="Contoh: Steve123" required>
<label>Rank yang dibeli</label>
<select id="rank" required>
<option value="">-- Pilih Rank --</option>
<option>ARECADE+</option><option>ARECADE++</option><option>ARECADE+++</option>
</select>
<label>Payment Method</label>
<select id="payment" required><option value="">-- Pilih metode --</option><option>SociaBuzz / QR</option></select>
<button type="submit">KONFIRMASI PEMBELIAN</button>
</form>
<div class="note">Simpan bukti pembayaran. Halaman ini belum otomatis memberikan rank ke Minecraft. Untuk otomatisasi diperlukan backend/API atau integrasi plugin server.</div>
</main>
<script>
document.getElementById('orderForm').addEventListener('submit',function(e){
e.preventDefault();
const u=document.getElementById('username').value.trim(),r=document.getElementById('rank').value,p=document.getElementById('payment').value;
const t='ARECADE SMP - KONFIRMASI PEMBELIAN\n\nMinecraft: '+u+'\nRank: '+r+'\nPayment: '+p;
if(navigator.clipboard) navigator.clipboard.writeText(t);
alert('Detail pembelian sudah disalin. Kirim detail tersebut bersama bukti pembayaran ke admin.');
});
</script>
</body>
</html>
