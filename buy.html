<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beli Rank</title><link rel="stylesheet" href="style.css"></head><body><header><a href="index.html">← Kembali</a><b>ARECADE <i>SMP</i></b></header><main class="form"><div class="card"><small>ORDER</small><h1 id="rank"></h1><p>Total: <strong id="price"></strong></p><form><label>Nama Player Minecraft</label><input id="user" maxlength="16" pattern="[A-Za-z0-9_]{3,16}" placeholder="Player123" required><label>Metode Pembayaran</label><select id="pay" required><option value="">Pilih metode</option><option>SociaBuzz / QR</option></select><button type="submit">LANJUT KE PEMBAYARAN</button></form><p class="note">Pastikan nama player benar.</p></div></main><script>
const q=new URLSearchParams(location.search),r=q.get('rank')||'ARECADE+',p=+(q.get('price')||10000);rank.textContent=r;price.textContent='Rp '+p.toLocaleString('id-ID');document.querySelector('form').onsubmit=e=>{e.preventDefault();localStorage.order=JSON.stringify({rank:r,price:p,user:user.value,payment:pay.value});location='payment.html'}
</script></body></html>
